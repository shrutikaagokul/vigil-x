# ─────────────────────────────────────────────
# Vigil-X  —  Rules Configuration
# ─────────────────────────────────────────────
# All rule thresholds are defined here.
# Do NOT hard-code magic numbers in rule files.
# ─────────────────────────────────────────────

rules:

  # ── R01: Duplicate Billing ────────────────
  R01:
    enabled: true
    version: "1.0"
    severity_exact: HIGH
    severity_near: MEDIUM
    near_dup_day_window: 1          # +/- days for near-duplicate matching
    # Modifiers that indicate legitimate separate services
    legitimate_modifiers:
      - "LT"
      - "RT"
      - "50"
      - "76"
      - "77"
    # Claim statuses that indicate correction/void (not fraud)
    void_statuses:
      - "voided"
      - "void"
      - "reversed"
    corrected_statuses:
      - "corrected"
      - "adjusted"
      - "replacement"

  # ── R02: Upcoding ────────────────────────
  R02:
    enabled: true
    version: "1.0"
    min_em_claims: 50               # Minimum E/M claims for provider evaluation
    mad_z_threshold: 3.0            # MAD-based z-score threshold
    share_multiplier: 2.0           # Level 4-5 share must exceed peer_median × this
    # Claim-level supporting evidence thresholds
    claim_level:
      low_complexity_max: 1         # dx_complexity <= this on level 5 = suspect
      duration_percentile: 25       # Service duration below peer p25 = suspect

  # ── R03: Unbundling ──────────────────────
  R03:
    enabled: true
    version: "1.0"
    base_severity: MEDIUM
    escalated_severity: HIGH
    # Modifiers that legitimately override bundling rules
    allowed_override_modifiers:
      - "59"
      - "25"
      - "XE"
    provider_rate_percentile: 95    # Escalate if provider rate exceeds peer p95

  # ── R04: Phantom Services ────────────────
  R04:
    enabled: true
    version: "1.0"
    severity_deceased: CRITICAL
    severity_terminated: CRITICAL
    severity_inpatient_overlap: HIGH
    severity_closed_facility: HIGH
    severity_non_operating_day: HIGH
    severity_orphan_ambulance: MEDIUM
    severity_ghost_member: LOW
    ghost_member:
      lookback_months: 12           # No claims in previous N months
      min_same_provider_claims: 5   # >= N claims with same provider
    ambulance_related_window_days: 1  # ER/facility claim within N days

  # ── R05: Excessive Utilization ───────────
  R05:
    enabled: true
    version: "1.0"
    base_severity: MEDIUM
    escalated_severity: HIGH
    provider_peer_multiplier: 3.0   # Provider mean visits > peer_median × this
    # Per code-group utilization caps (max per 30-day rolling window)
    utilization_caps:
      PT:
        max_per_30d: 12
        code_prefixes: ["97110", "97140", "97530", "97112", "97116"]
      DME_resupply:
        max_per_30d: 1
        code_prefixes: ["A4253", "A4259", "A7003", "A7004"]
      lab_panels:
        max_per_30d: 4
        code_prefixes: ["80050", "80053", "80061", "80076"]
      imaging:
        max_per_30d: 3
        code_prefixes: ["70553", "72148", "73721", "74177"]
